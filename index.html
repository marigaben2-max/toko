--shadow:0 12px 30px -12px rgba(0,0,0,.6);--navbg:rgba(21,35,31,.97);
--h1:#0F8F5B;--h2:#0A6F6A;--g:#2FD48A;--gbtn:#1FBF7C;--gbtn2:#17A56A;--on-g:#04241A;

:root[data-theme="dark"]{--outer:#08110E;--bg:#0D1815;--card:#15231F;--ink:#E7F6EF;--muted:#93B3A8;--line:#22362F;--soft:#1B2C27;
--shadow:0 12px 30px -12px rgba(0,0,0,.6);--navbg:rgba(21,35,31,.97);
--h1:#0F8F5B;--h2:#0A6F6A;--g:#2FD48A;--gbtn:#1FBF7C;--gbtn2:#17A56A;--on-g:#04241A;
--gl:#173B2C;--gt:#6FE7AE;--bl:#152B45;--bt:#8DC3FF;--b:#5AA9FF;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--h1),var(--h1)) no-repeat top left/100% env(safe-area-inset-top,0px),var(--outer)}
body{margin:0;background:var(--outer);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:28px;height:28px}

/* warna per-hue */
.h-g{--hl:var(--gl);--ht:var(--gt);--hs:var(--g);--hs2:#0B9A5E}
.h-b{--hl:var(--bl);--ht:var(--bt);--hs:var(--b);--hs2:#1A6FE0}
.h-y{--hl:var(--yl);--ht:var(--yt);--hs:var(--y);--hs2:#EE7A00}
.h-r{--hl:var(--rl);--ht:var(--rt);--hs:var(--r);--hs2:#DC2A5A}
.h-p{--hl:var(--pl);--ht:var(--pt);--hs:var(--p);--hs2:#5B3FE0}
.h-k{--hl:var(--kl);--ht:var(--kt);--hs:var(--k);--hs2:#D02A9E}
.h-o{--hl:var(--ol);--ht:var(--ot);--hs:var(--o);--hs2:#F0421A}
.h-t{--hl:var(--tl);--ht:var(--tt);--hs:var(--t);--hs2:#0889A0}

/* shell */
.app{max-width:600px;margin:0 auto;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--bg);position:relative;padding-bottom:110px;box-shadow:0 0 0 1px var(--line)}
.hdr{background:linear-gradient(150deg,var(--h1),var(--h2));color:#fff;padding:18px 18px 70px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hdr::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10)}
.hdr::after{content:"";position:absolute;left:-30px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07)}
.hdr>*{position:relative;z-index:1}
.hdr.slim{padding-bottom:20px;border-radius:0 0 26px 26px}
.hdr.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.hdr .sub{font-size:13px;opacity:.88;margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.icon-btn{width:42px;height:42px;flex:none;border-radius:14px;border:0;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center}
.icon-btn:active{transform:scale(.94)}
.icon-btn.add{background:#fff;color:var(--gbtn)}
.icon-btn.ghost{background:var(--soft);color:var(--ink)}
.pad{padding:16px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 8px;margin-top:6px}
.sec h2{font-size:16px;font-weight:800}
.sec a,.sec button.lnk{font-size:13px;font-weight:700;color:var(--gt);background:none;border:0;padding:4px 0}
.card{background:var(--card);border-radius:20px;border:1px solid var(--line);padding:16px;margin:0 16px 14px}
.mut{color:var(--muted)}
.sm{font-size:12.5px}
.b{font-weight:800}
.right{text-align:right}

/* home */
.sumcard{position:relative;z-index:2;margin:-52px 16px 0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--hl);border-radius:18px;padding:12px 12px 12px;color:var(--ht);min-width:0}
.stat .si{width:32px;height:32px;border-radius:11px;background:var(--hs);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.stat small{display:block;font-size:12px;font-weight:700;opacity:.9}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week{display:flex;gap:6px;align-items:flex-end;height:64px;margin-top:14px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wk i{display:block;width:100%;max-width:26px;border-radius:7px 7px 4px 4px;background:var(--gl);min-height:4px}
.wk.now i{background:var(--g)}
.wk span{font-size:10.5px;color:var(--muted);font-weight:600}
.mini{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.mini b{color:var(--ink)}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:22px 14px 8px}
.home-top{display:block}
.home-left{min-width:0}
.home-right{min-width:0}
.kasir-wrap{display:block;min-height:0}
.kasir-left{min-width:0}
.kasir-cart{display:none}
.kc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.kc-head b{font-size:15px}
.kc-lines{padding:0 16px;overflow:auto}
.kc-foot{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.kc-empty{padding:10px 4px}
@media (orientation:landscape) and (min-width:680px){
  .app{max-width:960px}
  .nav-in,.cartbar-in{max-width:920px}
  .home-top{display:flex;align-items:flex-start;gap:14px}
  .home-left{flex:1 1 0}
  .home-right{flex:0 1 340px;padding-top:16px}
  .home-right .menu{grid-template-columns:repeat(3,1fr);padding-top:4px}
  .kasir-wrap{display:flex;align-items:flex-start;gap:0;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 84px)}
  .kasir-left{flex:1 1 0;min-width:0;align-self:flex-start;position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 84px);overflow-y:auto}
  .kasir-cart{display:flex;flex-direction:column;flex:0 0 320px;border-left:1px solid var(--line);background:var(--card)}
  .kc-lines{flex:1 1 auto}
  body[data-view="kasir"] #cartbar{display:none!important}
}
.mi{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink)}
.mi .mb{width:58px;height:58px;border-radius:21px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--hs),var(--hs2,var(--hs)));box-shadow:0 10px 18px -8px var(--hs)}
.mi:active .mb{transform:scale(.93)}
.mi .mb .ic{width:26px;height:26px}
.alert{display:flex;gap:12px;align-items:center;margin:0 16px 12px;padding:14px;border-radius:18px;background:var(--hl);color:var(--ht);border:0;text-align:left;width:calc(100% - 32px)}
.alert .ai{width:38px;height:38px;border-radius:13px;background:var(--hs);color:#fff;display:grid;place-items:center;flex:none}
.alert b{display:block;font-size:14px;color:var(--ink)}
.alert small{font-size:12.5px}

/* list */
.li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 16px 10px;padding:10px 10px 10px 8px}
.li.static{padding:12px}
.li-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:2px;text-align:left}
.av{width:46px;height:46px;border-radius:15px;background:var(--hl);color:var(--ht);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.li-t{min-width:0;flex:1}
.li-t b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.li-t small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.amt{font-weight:800;font-size:15px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--hl);color:var(--ht);white-space:nowrap}
.strike{text-decoration:line-through;opacity:.6}

/* search + chips + seg */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:0 6px 0 14px;height:48px;flex:1;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);height:100%;outline:none}
.search:focus-within{border-color:var(--g)}
.scan-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--gbtn);color:var(--on-g);display:grid;place-items:center;flex:none}
.searchrow{display:flex;gap:10px;margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 15px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.chip.on{background:var(--gbtn);border-color:var(--gbtn);color:var(--on-g)}
.seg{display:flex;background:var(--soft);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.10)}
.seg.onhdr{background:rgba(255,255,255,.22)}
.seg.onhdr button{color:rgba(255,255,255,.9);height:34px;padding:0 14px;flex:none;font-size:13px}
.seg.onhdr button.on{background:#fff;color:#08744A;box-shadow:none}

/* kasir grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 16px 24px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:20px;display:flex;flex-direction:column;min-height:138px;overflow:hidden}
.tile-main{flex:1;width:100%;text-align:left;background:none;border:0;padding:11px;display:flex;flex-direction:column;gap:6px}
.tile-main:active{transform:scale(.97)}
.tile-units{display:flex;flex-wrap:wrap;gap:6px;padding:0 11px 11px}
.uchip{border:1.5px solid var(--b);background:var(--bl);color:var(--bt);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:800;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.uchip i{font-style:normal;background:rgba(255,255,255,.28);border-radius:8px;padding:0 6px;min-width:18px;text-align:center}
.uchip:active{transform:scale(.95)}
.uchip.in{background:var(--gbtn);border-color:var(--gbtn);color:var(--on-g)}
.ubadge{display:inline-block;background:var(--bl);color:var(--bt);border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:800;margin-left:4px;vertical-align:1px}
.usec{margin:6px 0 4px;padding:14px;border:1.5px dashed var(--line);border-radius:18px;background:var(--soft)}
.urow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 2px;margin-bottom:10px}
.urow-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}
.tile .av{width:44px;height:44px;border-radius:14px;font-size:15px}
.tile .nm{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.tile .pr{font-weight:800;font-size:15px;margin-top:auto}
.tile .pr small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.tile .st{font-size:11.5px;color:var(--muted)}
.tile .st.low{color:var(--rt);font-weight:700}
.tile .qb{position:absolute;top:9px;right:9px;min-width:27px;height:27px;border-radius:14px;background:var(--gbtn);color:var(--on-g);font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 8px}
.tile.in{border-color:var(--g);background:var(--gl)}

/* cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.cartbar-in{pointer-events:auto;width:100%;max-width:572px;display:flex;align-items:center;gap:12px;border:0;border-radius:20px;padding:10px 12px 10px 10px;background:linear-gradient(120deg,var(--gbtn),var(--gbtn2));color:var(--on-g);box-shadow:0 12px 26px -8px rgba(8,120,74,.55);text-align:left}
.cb-ic{position:relative;width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.cb-ic b{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--y);color:#3a2300;font-size:12px;display:grid;place-items:center;padding:0 5px}
.cb-t{flex:1;line-height:1.2}
.cb-t small{display:block;font-size:12px;opacity:.9}
.cb-t b{font-size:18px;font-weight:800}
.cb-go{display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:600px;background:var(--navbg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(16,86,62,.08);backdrop-filter:blur(10px)}
.nav-in button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.nav-in button .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav-in button.on{color:var(--gt)}
.nav-in button.on .pill{background:var(--gl)}
.nav-in button.mid{margin-top:-26px;color:var(--ink)}
.nav-in button.mid .pill{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border:4px solid var(--card);box-shadow:0 10px 20px -6px rgba(8,120,74,.6)}
.nav-in button.mid .ic{width:26px;height:26px}
.nav-in button.mid.on .pill{background:linear-gradient(145deg,var(--h1),var(--h2))}

/* form controls */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.inp{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.inp:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px var(--gl)}
.inp::placeholder{color:var(--muted);opacity:.7}
.inp-row{display:flex;gap:8px}
.inp-row .inp{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.hint.bad{color:var(--rt);font-weight:700}
.btn{height:48px;border-radius:15px;border:0;font-weight:800;font-size:15px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn-p{background:linear-gradient(180deg,var(--gbtn),var(--gbtn2));color:var(--on-g);box-shadow:0 8px 16px -8px rgba(8,120,74,.7)}
.btn-s{background:var(--soft);color:var(--ink)}
.btn-d{background:var(--rl);color:var(--rt)}
.btn-d2{background:var(--r);color:#fff}
.btn-b{background:var(--bl);color:var(--bt)}
.btn.block{width:100%}
.btn.sq{width:48px;padding:0;flex:none}
.btn-sm{height:34px;border-radius:11px;padding:0 12px;font-size:12.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border:0}
.toggle>div{flex:1}
.toggle b{display:block;font-size:14px}
.toggle small{color:var(--muted);font-size:12.5px}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;border:0}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--gbtn)}
.sw:checked::after{transform:translateX(20px)}

/* sheet & dialog */
#layer{position:relative;z-index:60}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,28,20,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.overlay.center{align-items:center;padding:20px;z-index:80}
.sheet{width:100%;max-width:600px;max-height:93dvh;max-height:min(93dvh,calc(var(--kb-vh, 100dvh) * .93));background:var(--card);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.overlay{align-items:center}.sheet{max-height:88dvh;max-height:min(88dvh,calc(var(--kb-vh, 100dvh) * .88));border-radius:28px}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;flex:none}
.sh-t{flex:1;min-width:0}
.sh-t h2{font-size:18px;font-weight:800;line-height:1.2}
.sh-s{font-size:13px;color:var(--muted)}
.sheet-b{overflow:auto;padding:6px 18px 20px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:none}
.dialog{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:380px;animation:pop .18s ease-out}
.dialog h3{font-size:17px;font-weight:800;margin-bottom:6px}
.dialog p{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.45}
.dlg-b{display:flex;gap:10px;margin-top:6px}
.dlg-b .btn{flex:1}
.dlg-b.stack{flex-direction:column-reverse}
.dlg-b.stack .btn{flex:none;width:100%}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:max-content;max-width:min(88vw,480px);transform:translate(-50%,16px);z-index:95;background:#0F2F27;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hascart .toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.toast.ok{background:#0B7A4B}.toast.err{background:#C22A20}

/* checkout */
.cl{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cl-name{font-weight:700;font-size:14px;line-height:1.25}
.price-btn{background:var(--soft);border:0;border-radius:9px;padding:4px 9px;font-weight:700;font-size:12.5px;margin-top:5px;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.price-btn small{color:var(--gt);font-weight:800}
.cl-tot{font-weight:800;text-align:right;align-self:center}
.stepper{display:flex;align-items:center;gap:4px;justify-self:end}
.stepper button{width:34px;height:34px;border-radius:11px;border:0;background:var(--soft);display:grid;place-items:center}
.stepper button.rm{background:var(--rl);color:var(--rt)}
.stepper input{width:54px;height:34px;text-align:center;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:15px}
.lowwarn{grid-column:1/-1;font-size:12px;color:var(--rt);font-weight:700}
.totalbox{background:linear-gradient(140deg,var(--gl),var(--tl));border-radius:20px;padding:14px 16px;margin:14px 0;color:var(--ink)}
.totalbox .tr{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:2px 0}
.totalbox .tt{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;margin-top:4px}
.totalbox .tt span{font-size:14px}
.totalbox .tt b{font-size:26px;letter-spacing:-.02em}
.qcash{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 10px}
.qcash .chip{padding:7px 12px}
.chgbox{padding:11px 14px;border-radius:14px;font-weight:800;display:flex;justify-content:space-between;background:var(--gl);color:var(--gt);margin-bottom:12px}
.chgbox.bad{background:var(--rl);color:var(--rt)}
.chgbox b{font-size:17px}
.dbtn-row{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 10px}

/* receipt */
.rcpt{font-family:'Courier New',ui-monospace,monospace;font-size:13px;background:#fff;color:#111;border-radius:14px;padding:16px 14px;border:1px dashed #c9d6d0;line-height:1.45}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #999;margin:9px 0}
.rcpt .r{display:flex;justify-content:space-between;gap:10px}
.rcpt .it{margin-bottom:4px}
.rcpt .big{font-weight:800;font-size:15px}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--gl);color:var(--gt);display:grid;place-items:center;margin:0 auto 8px}
.done-ic .ic{width:34px;height:34px;stroke-width:2.6}

/* laporan */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}
.kpi{background:var(--hl);border-radius:20px;padding:13px;color:var(--ht);min-width:0}
.kpi .ki{width:32px;height:32px;border-radius:11px;background:var(--hs);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.kpi small{display:block;font-size:12px;font-weight:700}
.kpi b{display:block;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:11.5px;opacity:.9}
.net{margin:0 16px 14px;background:linear-gradient(135deg,var(--p),var(--k));color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 24px -12px var(--p)}
.net .ni{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.net small{display:block;font-size:12.5px;opacity:.92;font-weight:700}
.net b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv.tot{font-weight:800}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.chart-wrap{overflow-x:auto;margin:0 -6px}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.chart .gl{stroke:var(--line);stroke-width:1}
.bar-a{fill:var(--b)}.bar-b{fill:var(--g)}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0 10px;display:flex}
.pbar i{display:block;height:100%}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0}
.rank+.rank{border-top:1px solid var(--line)}
.rank .n{width:26px;height:26px;border-radius:9px;background:var(--hl);color:var(--ht);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.period-custom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 8px}

/* timeline */
.tl{display:flex;gap:12px;padding:10px 0}
.tl+.tl{border-top:1px solid var(--line)}
.tl .dot{width:36px;height:36px;border-radius:12px;background:var(--hl);color:var(--ht);display:grid;place-items:center;flex:none}
.tl-t{flex:1;min-width:0}
.tl-t b{display:block;font-size:14px}
.tl-t small{display:block;color:var(--muted);font-size:12.5px}

/* empty */
.empty{text-align:center;padding:34px 24px}
.empty .eb{width:74px;height:74px;border-radius:26px;background:var(--hl);color:var(--ht);display:grid;place-items:center;margin:0 auto 14px}
.empty .eb .ic{width:34px;height:34px}
.empty h3{font-size:17px;font-weight:800;margin-bottom:4px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:16px}
.empty .btns{justify-content:center}
.empty .btns>.btn{flex:none}

/* scanner */
.scanner{position:fixed;inset:0;z-index:70;background:rgba(4,12,9,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sc-box{width:100%;max-width:380px;max-height:100%;background:#0c1a15;color:#fff;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px -18px rgba(0,0,0,.55);animation:pop .18s ease-out}
.sc-top{display:flex;align-items:center;gap:12px;padding:12px 14px;flex:none}
.sc-top .t{flex:1;line-height:1.2}
.sc-top .t b{display:block;font-size:16px}
.sc-top .t small{opacity:.75;font-size:12px}
.sc-cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;flex:none}
#sc-region{position:absolute;inset:0}
#sc-region video{width:100%!important;height:100%!important;object-fit:cover;border-radius:0}
.sc-msg{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);text-align:center;font-size:13.5px;line-height:1.5;opacity:.92;pointer-events:none}
.sc-bottom{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:#0c1a15;flex:none}
.sc-status{min-height:40px;border-radius:14px;padding:9px 14px;background:rgba(255,255,255,.12);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.sc-status.ok{background:#0B7A4B}.sc-status.warn{background:#A85A00}
.sc-manual{display:flex;gap:8px}
.sc-manual input{flex:1;min-width:0;height:44px;border-radius:14px;border:0;padding:0 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.95);color:#111}
.sc-row{display:flex;gap:8px;flex-wrap:wrap}
.sc-row .btn{flex:1 1 150px;min-width:0;height:42px;background:rgba(255,255,255,.16);color:#fff;font-size:13px}
.sc-row .btn.pri{background:var(--gbtn);color:var(--on-g)}
.sc-row label.btn{cursor:pointer}
.sc-row input[type=file]{display:none}
@media(min-width:480px){.sc-cam{aspect-ratio:16/10}}

@media print{
  html,body{background:#fff!important}
  .app,.nav,.cartbar,.toast,.sheet-h,.sheet-f,.grab,.noprint,.scanner{display:none!important}
  .overlay{position:static!important;background:none!important;display:block!important}
  .sheet{max-height:none!important;box-shadow:none!important;background:#fff!important}
  .sheet-b{overflow:visible!important;padding:0!important}
  .rcpt{border:0!important}
}

<script>
(function(){
'use strict';
/* ================= UTIL ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 3 });
const nf0 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const rp = n => { n = Math.round(+n || 0); return (n < 0 ? '-' : '') + 'Rp ' + nf0.format(Math.abs(n)); };
const qf = n => nf.format(Math.round((+n || 0) * 1000) / 1000);
const r3 = n => Math.round(n * 1000) / 1000;
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const parseQty = v => {
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).trim();
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
};
const moneyOf = el => { if (typeof el === 'string') el = $(el); return el ? (+String(el.value).replace(/[^\d]/g, '') || 0) : 0; };
const moneyStr = n => (n > 0 ? nf0.format(Math.round(n)) : '');
const pad = n => String(n).padStart(2, '0');
const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = d => new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateLong = d => new Date(d).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = d => { d = new Date(d); return pad(d.getHours()) + '.' + pad(d.getMinutes()); };
const fmtDT = d => fmtDate(d) + ', ' + fmtTime(d);
const isoLocal = d => { d = new Date(d); return dkey(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const HUES = ['g', 'b', 'o', 'p', 'k', 't', 'y', 'r'];
const hueOf = s => { s = String(s || '?').toLowerCase(); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return HUES[h % HUES.length]; };
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const normCode = c => String(c || '').trim().replace(/^0+/, '');
let uidSeq = 0;
const uid = () => { uidSeq = (uidSeq + 1) % 1000; return Date.now() * 1000 + uidSeq; };
const fmtShort = n => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.', ',') + ' M';
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' jt';
  if (a >= 1e3) return Math.round(n / 1e3) + ' rb';
  return String(Math.round(n));
};
const waPhone = p => { let d = String(p || '').replace(/\D/g, ''); if (!d) return ''; if (d.startsWith('0')) d = '62' + d.slice(1); else if (d.startsWith('8')) d = '62' + d; return d; };

/* ================= STATE ================= */
const DEF = { storeName: 'Warung Saya', address: '', phone: '', footer: 'Terima kasih sudah berbelanja!', allowNegative: true, beep: true, theme: 'auto', lastBackup: null, defMin: 5 };
const S = {
  view: 'home', ready: false, memOnly: false,
  products: [], customers: [], sales: [], payments: [], expenses: [], movements: [], settings: { ...DEF },
  pmap: new Map(), bmap: new Map(), cmap: new Map(), ver: 0,
  cart: { mode: 'eceran', lines: [], discount: 0 },
  kasir: { q: '', cat: 'Semua' }, produk: { q: '', f: 'semua' }, hutang: { q: '', tab: 'aktif' },
  period: { key: 'hari', from: '', to: '' }, lap: { top: 'qty', page: 1 }, ck: { method: 'tunai' },
  cloud: { user: null, ready: false, lastSync: null }
};
function reindex() {
  S.pmap = new Map(S.products.map(p => [p.id, p]));
  S.bmap = new Map();
  S.products.forEach(p => {
    if (p.barcode) S.bmap.set(normCode(p.barcode), { p, u: null });
    (p.units || []).forEach(u => { if (u.barcode) S.bmap.set(normCode(u.barcode), { p, u }); });
  });
  S.cmap = new Map(S.customers.map(c => [c.id, c]));
  S.ver++;
}
const findByBarcode = c => S.bmap.get(normCode(c)) || null;   // -> { p, u } | null
const unitById = (p, id) => (id ? (p.units || []).find(x => x.id === id) || null : null);
const lineUnit = (l, p) => unitById(p, l.u);
const codesOf = p => [p.barcode, ...(p.units || []).map(u => u.barcode)].filter(Boolean);

/* ================= INDEXEDDB ================= */
const STORES = ['products', 'customers', 'sales', 'payments', 'expenses', 'movements'];
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no-idb'));
    let r;
    try { r = indexedDB.open('warung-sembako', 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
const getAll = n => new Promise((res, rej) => {
  const q = db.transaction(n, 'readonly').objectStore(n).getAll();
  q.onsuccess = () => res(q.result || []);
  q.onerror = () => rej(q.error);
});
function batch(ops) {
  if (!db) return Promise.resolve();
  return new Promise((res, rej) => {
    const names = [...new Set(ops.map(o => o[1]))];
    const tx = db.transaction(names, 'readwrite');
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('abort'));
    ops.forEach(([op, st, v]) => {
      const os = tx.objectStore(st);
      if (op === 'put') os.put(v); else if (op === 'del') os.delete(v); else if (op === 'clear') os.clear();
    });
  });
}
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
async function loadAll() {
  if (!db) { reindex(); return; }
  const r = await Promise.all([...STORES.map(getAll), getAll('settings')]);
  S.products = r[0]; S.customers = r[1]; S.sales = r[2].sort(byDate); S.payments = r[3].sort(byDate);
  S.expenses = r[4].sort(byDate); S.movements = r[5].sort(byDate);
  const row = r[6].find(x => x.key === 'app') || {};
  const { key, ...rest } = row;
  S.settings = { ...DEF, ...rest };
  reindex();
}
async function save(ops) {
  if (!ops.length) return true;
  try { await batch(ops); scheduleCloudBackup(); return true; }
  catch (err) {
    console.error(err);
    toast('Gagal menyimpan data (' + ((err && err.name) || 'error') + ')', 'err');
    try { await loadAll(); } catch (e) { }
    render();
    return false;
  }
}
const saveSettings = () => save([['put', 'settings', { key: 'app', ...S.settings }]]);

/* ================= CADANGAN CLOUD (opsional) ================= */
let cloudTimer = null;
function scheduleCloudBackup() {
  if (!S.cloud.user || !window.CloudSync) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => { doCloudBackup().catch(e => console.error('cloud backup gagal', e)); }, 6000);
}
function snapshotData() {
  return { app: 'warung-sembako', version: 2, exportedAt: new Date().toISOString(), data: { products: S.products, customers: S.customers, sales: S.sales, payments: S.payments, expenses: S.expenses, movements: S.movements, settings: S.settings } };
}
async function doCloudBackup() {
  if (!S.cloud.user || !window.CloudSync) return;
  const snap = snapshotData();
  await window.CloudSync.backupNow(snap);
  S.cloud.lastSync = snap.exportedAt;
  if (S.view === 'data') render();
}
document.addEventListener('cloud-ready', () => { S.cloud.ready = true; if (S.view === 'data') render(); });
document.addEventListener('cloud-auth', e => { S.cloud.user = e.detail; if (S.view === 'data') render(); });
document.addEventListener('cloud-login-error', e => toast('Gagal masuk: ' + e.detail, 'err'));

/* ================= PERHITUNGAN ================= */
function tierOf(l, p) {
  if (l.price != null) return S.cart.mode;
  const u = lineUnit(l, p), w = u ? u.wholesale : p.wholesale;
  if (w > 0 && (S.cart.mode === 'grosir' || (!u && p.wMin > 0 && l.qty >= p.wMin))) return 'grosir';
  return 'eceran';
}
function unitPrice(l, p) {
  if (l.price != null) return l.price;
  const u = lineUnit(l, p);
  return tierOf(l, p) === 'grosir' ? (u ? u.wholesale : p.wholesale) : (u ? u.retail : p.retail);
}
const lineValid = l => { const p = S.pmap.get(l.pid); return !!p && l.qty > 0 && (!l.u || !!unitById(p, l.u)); };
function cartTotals() {
  let subtotal = 0, cogs = 0, qty = 0; const use = new Map();
  const rows = S.cart.lines.filter(lineValid).map(l => {
    const p = S.pmap.get(l.pid), u = lineUnit(l, p), factor = u ? u.factor : 1, price = unitPrice(l, p), tier = tierOf(l, p), total = Math.round(l.qty * price);
    subtotal += total; cogs += l.qty * factor * p.cost; qty += l.qty * factor; use.set(p.id, r3((use.get(p.id) || 0) + l.qty * factor));
    return { l, p, u, factor, uname: u ? u.name : p.unit, price, tier, total, cost: factor * p.cost };
  });
  const discount = Math.min(Math.max(0, Math.round(S.cart.discount || 0)), subtotal);
  return { rows, use, subtotal, discount, total: subtotal - discount, cogs: Math.round(cogs), count: rows.length, qty };
}

function niceMax(v) {

/* ================= TOMBOL KEMBALI PERANGKAT ================= */
// Setiap "lapisan" yang tampil di atas layar utama (scanner, sheet, dialog, atau
// tab selain beranda) didaftarkan di sini. Saat tombol kembali perangkat ditekan,
// lapisan paling atas ditutup lebih dulu; kalau sudah tidak ada lapisan (di beranda),
// tombol kembali dibiarkan bekerja seperti biasa (keluar aplikasi).
const BACK = [];
let backPending = 0;      // jumlah history.back() yang kita panggil sendiri (bukan dari tombol fisik)
let backFromDevice = false; // true selagi menutup lapisan akibat tombol kembali perangkat

function pushBack(close) {
  const entry = { close };
  BACK.push(entry);
  history.pushState({ appLayer: BACK.length }, '');
  return entry;
}
// Dipanggil oleh setiap fungsi "tutup" (tombol X, simpan, batal, dst) setelah
// elemen di layar sudah ditutup. entry = objek yang dikembalikan pushBack().
function popBack(entry) {
  const i = entry ? BACK.lastIndexOf(entry) : BACK.length - 1;
  if (i === -1) return;
  const wasTop = i === BACK.length - 1;
  BACK.splice(i, 1);
  if (backFromDevice) return; // history sudah maju sendiri lewat tombol fisik, tidak perlu apa-apa lagi
  if (wasTop) { backPending++; history.back(); }
  // kalau bukan yang paling atas (kasus jarang, mis. layar lain sempat terbuka
  // di atasnya lalu ditutup duluan), riwayatnya dibiarkan saja - tidak memicu
  // history.back() supaya tidak bentrok dengan riwayat yang lain
}
window.addEventListener('popstate', () => {
  if (backPending > 0) { backPending--; return; }
  if (!BACK.length) return; // sudah di beranda tanpa layar tambahan -> biarkan (aplikasi keluar)
  const top = BACK[BACK.length - 1];
  backFromDevice = true;
  try { top.close(); } finally { backFromDevice = false; }
});

function cashChips(total) {
  const set = new Set([total]);
  [1000, 5000, 10000, 50000, 100000].forEach(u => { const v = Math.ceil(total / u) * u; if (v >= total) set.add(v); });
  return [...set].sort((a, b) => a - b).slice(0, 5);
}

function ckRender() {
  const sh = sheetEl('sh-cart'); if (!sh) return;
  S.cart.discount = moneyOf('#ckDisc');
  let T = cartTotals();
  if (!T.count) { closeSheet('sh-cart'); renderCartBar(); return; }
  if (S.cart.discount > T.subtotal) { S.cart.discount = T.subtotal; $('#ckDisc').value = moneyStr(T.subtotal); T = cartTotals(); }
  const seen = new Set();
  $('#ckLines').innerHTML = T.rows.map(({ l, p, u, factor, uname, price, tier, total }) => {
    const key = `data-pid="${p.id}" data-u="${l.u || 0}"`, first = !seen.has(p.id), used = T.use.get(p.id) || 0; seen.add(p.id);
    return `<div class="cl"><div><div class="cl-name">${esc(p.name)}${u ? ` <span class="ubadge">${esc(uname)} · isi ${qf(factor)} ${esc(p.unit)}</span>` : ''}</div>
      <button class="price-btn" data-act="ck-price" ${key}>${rp(price)} / ${esc(uname)} ${l.price != null ? '<small>diubah</small>' : tier === 'grosir' ? '<small>grosir</small>' : ''} ${ic('edit', 'sm')}</button></div>
      <div class="stepper"><button class="${l.qty <= 1 ? 'rm' : ''}" data-act="ck-dec" ${key} aria-label="Kurangi">${ic(l.qty <= 1 ? 'trash' : 'minus', 'sm')}</button><input class="qty" ${key} value="${qf(l.qty)}" inputmode="decimal" aria-label="Jumlah ${esc(p.name)} ${esc(uname)}"><button data-act="ck-inc" ${key} aria-label="Tambah">${ic('plus', 'sm')}</button></div>
      <div></div><div class="cl-tot">${rp(total)}</div>
      ${first && used > p.stock ? `<div class="lowwarn">${S.settings.allowNegative ? 'Stok tercatat' : 'Stok hanya'} ${qf(p.stock)} ${esc(p.unit)} · terpakai ${qf(used)} ${esc(p.unit)}</div>` : ''}</div>`;
  }).join('');
  $('#ckTotal').innerHTML = `${T.discount ? `<div class="tr"><span>Subtotal</span><span>${rp(T.subtotal)}</span></div><div class="tr"><span>Diskon</span><span>-${rp(T.discount)}</span></div>` : ''}<div class="tt"><span>Total bayar</span><b>${rp(T.total)}</b></div>`;
  $('#ckChips').innerHTML = cashChips(T.total).map(v => `<button class="chip" data-act="ck-chip" data-v="${v}">${v === T.total ? 'Uang pas' : nf0.format(v)}</button>`).join('');
  ckUpdate();
}
function ckUpdate() {
  if (!sheetEl('sh-cart')) return;
  const T = cartTotals();
  if (S.ck.method === 'tunai') {
    const g = moneyOf('#ckGiven'), box = $('#ckChange');
    if (!g) { box.className = 'chgbox'; box.innerHTML = '<span>Kembalian</span><b>Rp 0 (uang pas)</b>'; }
    else if (g < T.total) { box.className = 'chgbox bad'; box.innerHTML = `<span>Kurang</span><b>${rp(T.total - g)}</b>`; }
    else { box.className = 'chgbox'; box.innerHTML = `<span>Kembalian</span><b>${rp(g - T.total)}</b>`; }
    $('#ckBtn').textContent = 'Selesaikan · ' + rp(T.total);
  } else {
    const dp = Math.min(moneyOf('#ckDp'), T.total);
    $('#ckDebtBox').innerHTML = `<span>Sisa hutang</span><b>${rp(T.total - dp)}</b>`;
    $('#ckBtn').textContent = 'Catat hutang · ' + rp(T.total - dp);
  }
}

function ckCustHint() {
  const el = $('#ckPrev'); if (!el) return;
  const name = ($('#ckName').value || '').trim().toLowerCase(), c = S.customers.find(x => x.name.toLowerCase() === name);

function nextInvoice(d) {
  const key = dkey(d).replace(/-/g, ''); let n = S.sales.filter(s => dkey(s.date).replace(/-/g, '') === key && !s.opening).length + 1, no;
  do { no = 'INV-' + key + '-' + String(n++).padStart(3, '0'); } while (S.sales.some(s => s.no === no));
  return no;
}
A['ck-pay'] = () => finalizeSale();
async function finalizeSale() {
  const T = cartTotals(); if (!T.count) return;
  const method = S.ck.method; let cashGiven = 0, paidNow = 0, change = 0, debt = 0, cust = null, newCust = false, dueDate = '';
  if (!S.settings.allowNegative) {
    for (const [pid, used] of T.use) { const p = S.pmap.get(pid); if (p && used > p.stock) { toast(`Stok ${p.name} hanya ${qf(p.stock)} ${p.unit}`, 'err'); return; } }
  }
  if (method === 'tunai') {
    cashGiven = moneyOf('#ckGiven') || T.total;
    if (cashGiven < T.total) { toast('Uang diterima kurang dari total', 'err'); return; }
    paidNow = T.total; change = cashGiven - T.total;
  } else {
    const name = $('#ckName').value.trim();
    if (!name) { toast('Isi nama penghutang dulu', 'err'); $('#ckName').focus(); return; }
    const dp = Math.min(moneyOf('#ckDp'), T.total);
    if (T.total <= 0 || dp >= T.total) { toast('DP sama dengan total. Pilih metode Tunai.', 'err'); return; }
    paidNow = dp; cashGiven = dp; debt = T.total - dp; dueDate = $('#ckDue').value || '';
    const phone = $('#ckPhone').value.trim();
    cust = S.customers.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (!cust) { cust = { id: uid(), name, phone, note: '', createdAt: new Date().toISOString() }; newCust = true; }
    else if (phone && !cust.phone) { cust.phone = phone; newCust = true; }
  }
  const now = new Date(), nowIso = now.toISOString();
  const sale = {
    id: uid(), no: nextInvoice(now), date: nowIso, mode: S.cart.mode,
    items: T.rows.map(r => ({ pid: r.p.id, name: r.p.name, unit: r.uname, base: r.p.unit, factor: r.factor, qty: r.l.qty, price: r.price, cost: r.cost, tier: r.tier })),
    subtotal: T.subtotal, discount: T.discount, total: T.total, cogs: T.cogs, profit: T.total - T.cogs,
    method, cashGiven, paidNow, change, debt, debtLeft: debt,
    customerId: cust ? cust.id : null, customerName: cust ? cust.name : '', dueDate, note: ($('#ckNote').value || '').trim(), voided: false
  };
  const ops = [['put', 'sales', sale]];
  T.rows.forEach(({ l, p, factor, uname }) => {
    const used = r3(l.qty * factor), before = p.stock; p.stock = r3(p.stock - used); p.updatedAt = nowIso;
    const mv = { id: uid(), date: nowIso, pid: p.id, name: p.name, type: 'jual', qty: -used, before, after: p.stock, ref: sale.id, note: sale.no + (factor !== 1 ? ` · ${qf(l.qty)} ${uname}` : '') };
    S.movements.push(mv); ops.push(['put', 'products', p], ['put', 'movements', mv]);
  });
  if (cust && newCust) { if (!S.customers.includes(cust)) S.customers.push(cust); ops.push(['put', 'customers', cust]); }
  S.sales.push(sale); reindex();
  const btn = $('#ckBtn'); if (btn) btn.disabled = true;
  const ok = await save(ops);
  if (ok) {
    S.cart = { mode: S.cart.mode, lines: [], discount: 0 };
    closeSheet('sh-cart'); render(); showReceipt(sale, true);
  } else if (btn) btn.disabled = false;
}

function receiptHTML(s) {
  const st = S.settings, rr = (a, b, cls = '') => `<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
  let h = `<div class="rcpt" id="rcpt"><div class="c"><b>${esc(st.storeName)}</b>${st.address ? `<div>${esc(st.address)}</div>` : ''}${st.phone ? `<div>Telp ${esc(st.phone)}</div>` : ''}</div><hr>
    <div>${esc(s.no)}</div><div>${esc(fmtDT(s.date))}</div>${s.customerName ? `<div>Pelanggan: ${esc(s.customerName)}</div>` : ''}<hr>`;
  if (s.opening) h += `<div>Saldo hutang awal${s.note ? ' — ' + esc(s.note) : ''}</div>`;
  else h += (s.items || []).map(i => `<div class="it"><div>${esc(i.name)}</div>${rr(qf(i.qty) + ' ' + esc(i.unit) + ' x ' + nf0.format(i.price), nf0.format(Math.round(i.qty * i.price)))}</div>`).join('');
  h += '<hr>';
  if (s.discount) h += rr('Subtotal', nf0.format(s.subtotal)) + rr('Diskon', '-' + nf0.format(s.discount));
  h += rr('TOTAL', nf0.format(s.total), 'big');
  if (s.method === 'tunai') h += rr('Tunai', nf0.format(s.cashGiven)) + rr('Kembali', nf0.format(s.change));
  else { if (s.paidNow > 0) h += rr('DP dibayar', nf0.format(s.paidNow)); h += rr('Sisa hutang', nf0.format(s.debt), 'big'); if (s.dueDate) h += rr('Jatuh tempo', esc(fmtDate(s.dueDate + 'T00:00:00'))); }
  if (s.note && !s.opening) h += `<hr><div>Catatan: ${esc(s.note)}</div>`;
  return h + `<hr><div class="c">${esc(st.footer || '')}</div>${s.voided ? '<div class="c b" style="color:#c22a20;margin-top:6px">** DIBATALKAN **</div>' : ''}</div>`;
}
function receiptText(s) {
  const st = S.settings, L = [st.storeName]; if (st.address) L.push(st.address);
  L.push('------------------------', s.no + ' · ' + fmtDT(s.date)); if (s.customerName) L.push('Pelanggan: ' + s.customerName); L.push('------------------------');
  if (s.opening) L.push('Saldo hutang awal');
  (s.items || []).forEach(i => L.push(`${i.name}\n  ${qf(i.qty)} ${i.unit} x ${nf0.format(i.price)} = ${nf0.format(Math.round(i.qty * i.price))}`));

  L.push('TOTAL: ' + rp(s.total));

  else { if (s.paidNow > 0) L.push('DP: ' + rp(s.paidNow)); L.push('Sisa hutang: ' + rp(s.debt)); }

}
function showReceipt(s, fresh) {
  const c = s.customerId ? S.cmap.get(s.customerId) : null, wa = 'https://wa.me/' + (c ? waPhone(c.phone) : '') + '?text=' + encodeURIComponent(receiptText(s));

    footer: `<div class="btns" style="margin-bottom:${fresh || s.voided ? '10' : '10'}px"><a class="btn btn-b" href="${wa}" target="_blank" rel="noopener">${ic('chat', 'sm')} WhatsApp</a><button class="btn btn-s" data-act="sale-copy" data-id="${s.id}">${ic('copy', 'sm')} Salin</button><button class="btn btn-s" data-act="sale-print">${ic('printer', 'sm')} Cetak</button></div>
      ${fresh ? `<button class="btn btn-p block" data-act="sheet-close">Selesai</button>` : (!s.voided ? `<button class="btn btn-d block" data-act="sale-void" data-id="${s.id}">${ic('undo', 'sm')} Batalkan transaksi</button>` : '')}`
  });
}
const saleById = id => S.sales.find(s => s.id === id);
A['sale-open'] = t => { const s = saleById(Number(t.dataset.id)); if (s) showReceipt(s, false); };
A['sale-print'] = () => { try { window.print(); } catch (e) { toast('Cetak tidak tersedia di tampilan ini', 'err'); } };
A['sale-copy'] = t => { const s = saleById(Number(t.dataset.id)); if (s) copyText(receiptText(s)); };
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Struk disalin', 'ok'); return; } catch (e) { }
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? 'Struk disalin' : 'Tidak bisa menyalin', ok ? 'ok' : 'err'); } catch (e) { toast('Tidak bisa menyalin', 'err'); }
}
A['sale-void'] = async t => {
  const s = saleById(Number(t.dataset.id)); if (!s || s.voided) return;
  if (s.debt > 0 && s.debtLeft !== s.debt) { toast('Transaksi ini sudah ada pembayaran hutang. Batalkan pembayarannya dulu di Buku Hutang.', 'err'); return; }
  if (!await confirmDlg({ title: 'Batalkan transaksi?', msg: `${esc(s.no)} senilai ${rp(s.total)} akan dibatalkan. Stok dikembalikan dan tidak dihitung di laporan.`, ok: 'Batalkan transaksi', cancel: 'Kembali', danger: true })) return;
  const now = new Date().toISOString(), ops = [];
  s.voided = true; s.voidedAt = now; ops.push(['put', 'sales', s]);
  (s.items || []).forEach(i => {
    const p = S.pmap.get(i.pid); if (!p) return;
    const back = r3(i.qty * (i.factor || 1)), before = p.stock; p.stock = r3(p.stock + back); p.updatedAt = now;
    const mv = { id: uid(), date: now, pid: p.id, name: p.name, type: 'batal', qty: back, before, after: p.stock, ref: s.id, note: 'Batal ' + s.no };
    S.movements.push(mv); ops.push(['put', 'products', p], ['put', 'movements', mv]);
  });
  reindex();
  if (await save(ops)) { closeSheet('sh-rcpt'); render(); toast('Transaksi dibatalkan', 'ok'); }
};

      if (c === 'rate_limited') { toast('Tunggu sebentar, lalu coba lagi', 'err'); return false; }

    }

async function applyReplace(R) {

async function applyMerge(R) {
  const now = new Date().toISOString(), ops = []; let added = 0, updated = 0;
  R.products.forEach(np => {
    const hit = np.barcode ? findByBarcode(np.barcode) : null, ex = hit ? hit.p : S.products.find(p => p.name.toLowerCase() === np.name.toLowerCase());
    if (ex) {

async function importFile(f) {
  try {
    const buf = await f.arrayBuffer(), u8 = new Uint8Array(buf);
    if (u8[0] === 0x50 && u8[1] === 0x4B) return await importSheets(await readXlsx(buf), false);       // PK = xlsx

    if (/^\s*\{/.test(text)) return await importJSON(text);
    return await importSheets({ Produk: parseCSV(text) }, true);
  } catch (e) {
    console.error(e);
    const m = String((e && e.message) || e);
    toast(m === 'no-inflate' ? 'Browser ini belum bisa membaca .xlsx terkompresi. Gunakan file JSON.' : m === 'bukan-cadangan' ? 'File JSON ini bukan cadangan Warung Sembako' : 'File tidak bisa dibaca. Pastikan file .xlsx hasil ekspor aplikasi ini.', 'err');

// Perbaikan khusus: sebagian browser Android (mis. ColorOS/Oppo) tidak
// menghitung ulang tinggi elemen saat keyboard virtual muncul, sehingga
// kolom input di form (sheet) bisa "hilang" tergeser ke atas. Di sini kita
// pakai visualViewport API (didukung luas) untuk menyesuaikan tinggi sheet
// secara aktif, dan memaksa kolom yang sedang diisi tetap terlihat.
(function keyboardFix() {
  const root = document.documentElement;
  function applyVvh() {
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    root.style.setProperty('--kb-vh', h + 'px');
  }
  applyVvh();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyVvh);
    window.visualViewport.addEventListener('scroll', applyVvh);
  } else {
    window.addEventListener('resize', applyVvh);
  }

  document.addEventListener('focusin', e => {
    const el = e.target;
    if (!el || !(el.matches && el.matches('input, textarea, select'))) return;
    if (!el.closest('.sheet, .dialog')) return;
    setTimeout(() => {
      applyVvh();
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 300);
  }, true);
})();

})();
